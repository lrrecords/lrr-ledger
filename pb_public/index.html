<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LRR Work Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#041a2e;
    --panel:#0a2a45;
    --panel-raised:#0f3a5c;
    --hairline:#1f4d6e;
    --paper:#f2f3f5;
    --paper-dim:#9fb2c2;
    --brass:#fd882b;
    --brass-bright:#ffa35c;
    --teal:#3f7089;
    --signal:#d1453a;
    --good:#6f9070;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:32px 20px 64px;
  }
  .wrap{ max-width:760px; margin:0 auto; }

  .brand-bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
    padding-bottom:16px;
    border-bottom:1px solid var(--hairline);
  }
  .brand-logo{ flex-shrink:0; display:block; }
  .brand-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.04em;
    color:var(--paper-dim);
    text-transform:uppercase;
  }

  .site-footer{
    text-align:center;
    margin-top:40px;
    padding-top:16px;
    font-size:11px;
    color:var(--paper-dim);
  }
  .site-footer a{ color:var(--brass); text-decoration:none; }
  .site-footer a:hover{ color:var(--brass-bright); }

  header{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:36px;
  }
  .header-text{ flex:1; }
  .header-text h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    letter-spacing:0.01em;
    margin:0 0 4px;
    color:var(--paper);
  }
  .header-text p{
    margin:0;
    font-size:12px;
    color:var(--paper-dim);
    letter-spacing:0.02em;
  }
  .back-link{ color:var(--brass); font-size:11px; text-decoration:none; display:inline-block; margin-bottom:4px; }
  .logout-link{ font-size:11px; color:var(--paper-dim); cursor:pointer; white-space:nowrap; }
  .logout-link:hover{ color:var(--paper); }

  .readout{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:22px 24px;
    margin-bottom:28px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:18px;
  }
  .readout .cell{ display:flex; flex-direction:column; gap:6px; }
  .readout .cell + .cell{ border-left:1px solid var(--hairline); padding-left:18px; }
  .readout label{
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--paper-dim);
  }
  .readout .value{
    font-family:'Fraunces', serif;
    font-size:26px;
    font-variant-numeric:tabular-nums;
    color:var(--paper);
  }
  .readout .value.remaining{ color:var(--brass-bright); }
  .readout .value.negative{ color:var(--signal); }
  .readout input.editable-budget{
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--hairline);
    color:var(--paper);
    font-family:'Fraunces', serif;
    font-size:26px;
    font-variant-numeric:tabular-nums;
    width:100%;
    padding:0 0 2px;
  }
  .readout input.editable-budget:focus{ outline:none; border-bottom-color:var(--brass); }

  .meter-track{
    grid-column:1 / -1;
    height:6px;
    background:var(--hairline);
    border-radius:3px;
    overflow:hidden;
    margin-top:2px;
  }
  .meter-fill{
    height:100%;
    background:linear-gradient(90deg, var(--brass), var(--brass-bright));
    transition:width 0.4s ease;
  }
  .meter-fill.over{ background:linear-gradient(90deg, var(--signal), #d1655a); }

  .panel{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:20px;
    margin-bottom:28px;
  }
  .panel h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:15px;
    margin:0 0 16px;
    color:var(--paper-dim);
  }
  .form-grid{
    display:grid;
    grid-template-columns:1.2fr 1.1fr 0.7fr 0.9fr 0.6fr;
    gap:10px;
    align-items:end;
    margin-bottom:12px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:10px; letter-spacing:0.06em; color:var(--paper-dim); }
  .field input, .field select{
    background:var(--panel-raised);
    border:1px solid var(--hairline);
    border-radius:2px;
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    padding:9px 10px;
    width:100%;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--brass); }
  .field .hint{ font-size:10px; color:var(--teal); }

  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .btn-add{
    background:var(--brass);
    border:1px solid var(--brass);
    color:var(--ink);
    padding:10px 14px;
    font-weight:600;
    width:100%;
  }
  .btn-add:hover{ background:var(--brass-bright); }

  .ledger h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:15px;
    margin:0 0 14px;
    color:var(--paper-dim);
  }
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left;
    font-size:10px;
    letter-spacing:0.06em;
    color:var(--paper-dim);
    padding:0 10px 10px;
    border-bottom:1px solid var(--hairline);
  }
  thead th.num{ text-align:right; }
  tbody td{
    padding:12px 10px;
    font-size:13px;
    border-bottom:1px solid var(--hairline);
    vertical-align:top;
  }
  tbody td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:last-child td{ border-bottom:none; }
  .date-edit{
    background:transparent; border:none; color:var(--paper); font-family:'IBM Plex Mono', monospace;
    font-size:13px; padding:0; width:120px; cursor:pointer;
  }
  .date-edit:hover{ color:var(--brass); }
  .date-edit:focus{ outline:none; color:var(--paper); cursor:text; }
  .song-name{ color:var(--paper); font-weight:500; }
  .work-type{ color:var(--paper-dim); font-size:11px; margin-top:2px; }
  .cost-cell{ color:var(--brass-bright); }
  .balance-cell{ color:var(--paper-dim); }
  .empty-row td{
    text-align:center;
    color:var(--paper-dim);
    padding:32px 10px;
    font-size:12px;
  }
  .del-btn{
    background:none; border:none; color:var(--teal); font-size:14px; padding:0 4px; cursor:pointer;
  }
  .del-btn:hover{ color:var(--signal); }
  .drag-handle{
    display:inline-block; color:var(--paper-dim); cursor:grab; margin-right:8px; font-size:13px; user-select:none;
  }
  .drag-handle:hover{ color:var(--brass); }
  tbody tr[draggable="true"]{ cursor:default; }
  tbody tr.dragging{ opacity:0.4; }
  tbody tr.drag-over{ border-top:2px solid var(--brass); }
  .reorder-btn{
    display:none;
    background:none; border:none; color:var(--teal); font-size:14px; padding:0 4px; cursor:pointer;
  }
  .reorder-btn:hover{ color:var(--brass); }
  .reorder-btn:disabled{ color:var(--hairline); cursor:default; }
  .row-actions{ display:flex; align-items:center; gap:2px; justify-content:flex-end; white-space:nowrap; }

  @media (pointer: coarse){
    .drag-handle{ display:none; }
    .reorder-btn{ display:inline-block; }
    tbody tr[draggable="true"]{ /* drag disabled visually on touch; buttons take over */ }
  }

  .footer-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:28px;
    padding-top:16px;
    border-top:1px solid var(--hairline);
    font-size:11px;
    color:var(--paper-dim);
  }
  .toggle-link{ color:var(--brass); text-decoration:none; cursor:pointer; }
  .toggle-link:hover{ color:var(--brass-bright); }
  .save-note{ font-size:11px; color:var(--teal); min-height:14px; }

  .login-box{ max-width:340px; margin:100px auto; background:var(--panel); border:1px solid var(--hairline); border-radius:3px; padding:28px; }
  .login-box h2{ font-family:'Fraunces', serif; font-size:18px; margin:0 0 20px; color:var(--paper); }
  .login-box .field{ margin-bottom:14px; }
  .login-box .error{ color:var(--signal); font-size:12px; min-height:16px; margin-top:8px; }

  .client-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:28px; }
  .client-list a{ display:flex; justify-content:space-between; padding:14px 16px; background:var(--panel); border:1px solid var(--hairline); border-radius:3px; color:var(--paper); text-decoration:none; font-size:13px; }
  .client-list a:hover{ border-color:var(--brass); }
  .client-list .budget{ color:var(--paper-dim); align-self:center; }
  .client-list a > span:first-child{ display:flex; flex-direction:column; gap:3px; }
  .client-name{ color:var(--paper); }
  .client-meta{ color:var(--paper-dim); font-size:11px; }
  .optional-tag{ color:var(--paper-dim); font-weight:400; text-transform:none; letter-spacing:0; font-size:9px; }
  .send-preview{ margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline); }
  .message-preview{
    display:block; width:100%; margin-top:10px; min-height:140px;
    background:var(--panel-raised); border:1px solid var(--hairline); border-radius:2px;
    color:var(--paper-dim); font-family:'IBM Plex Mono', monospace; font-size:12px;
    padding:10px; resize:vertical;
  }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--paper-dim);
    padding:6px 10px;
    font-size:11px;
  }
  .btn-ghost:hover{ border-color:var(--teal); color:var(--paper); }
  .new-client-form{ display:grid; grid-template-columns:1.4fr 1fr 0.8fr; gap:10px; align-items:end; margin-bottom:12px; }
  .manager-heading{ font-family:'Fraunces', serif; font-weight:500; font-size:18px; color:var(--paper); margin:0 0 16px; }

  @media (max-width:640px){
    .form-grid{ grid-template-columns:1fr 1fr; }
    .new-client-form{ grid-template-columns:1fr; }
    .readout{ grid-template-columns:1fr; }
    .readout .cell + .cell{ border-left:none; border-top:1px solid var(--hairline); padding-left:0; padding-top:14px; }
    thead th:nth-child(2), tbody td:nth-child(2){ display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-bar">
    <img class="brand-logo" src="logo.png" width="44" height="44" alt="Little Rascal Records" />
    <span class="brand-name">Little Rascal Records</span>
  </div>
  <div id="app">Loading…</div>
  <footer class="site-footer">
    Made by <a href="https://lrrecords.com.au" target="_blank" rel="noopener">Little Rascal Records</a>
  </footer>
</div>

<script>
(function(){
  const API = window.location.origin;
  const RATES = { editing: 50, mastering: 50, stem: 175, revision: 0, extra_revision: 45 };
  const QTY_LABELS = { editing: 'HOURS', mastering: 'SONGS', stem: 'SONGS', revision: 'ROUNDS', extra_revision: 'ROUNDS', custom: 'QTY' };
  const UNITS = { editing: 'hr', mastering: 'song', stem: 'song', revision: 'round', extra_revision: 'round' };

  const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const clientSlug = params.get('client');
  const isClientView = params.get('view') === 'client';

  function getToken(){ return localStorage.getItem('pb_token'); }
  function setToken(t){ localStorage.setItem('pb_token', t); }
  function clearToken(){ localStorage.removeItem('pb_token'); }

  function money(n){
    const sign = n < 0 ? '-' : '';
    return sign + '$' + Math.abs(n).toFixed(2);
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function pbFetch(path, options){
    options = options || {};
    const token = getToken();
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers['Authorization'] = token;
    const res = await fetch(API + path, Object.assign({}, options, { headers: headers }));
    if (res.status === 401 || res.status === 403) {
      clearToken();
      renderLogin('Session expired — please sign in again.');
      throw new Error('Not authenticated');
    }
    if (!res.ok) {
      const body = await res.json().catch(function(){ return {}; });
      throw new Error(body.message || ('Request failed (' + res.status + ')'));
    }
    return res.status === 204 ? null : res.json();
  }

  // ---------- LOGIN ----------
  function renderLogin(message){
    app.innerHTML =
      '<div class="login-box">' +
        '<h2>LRR Ledger — Sign in</h2>' +
        '<div class="field"><label>EMAIL</label><input id="loginEmail" type="email" autocomplete="username" /></div>' +
        '<div class="field"><label>PASSWORD</label><input id="loginPass" type="password" autocomplete="current-password" /></div>' +
        '<button class="btn-add" id="loginBtn">Sign in</button>' +
        '<div class="error" id="loginError">' + escapeHtml(message || '') + '</div>' +
      '</div>';

    document.getElementById('loginPass').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('loginBtn').addEventListener('click', async function(){
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      try {
        const res = await fetch(API + '/api/collections/_superusers/auth-with-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity: email, password: pass })
        });
        if (!res.ok) throw new Error('Invalid email or password');
        const data = await res.json();
        setToken(data.token);
        boot();
      } catch (err) {
        errEl.textContent = err.message || 'Sign in failed';
      }
    });
  }

  // ---------- CLIENT MANAGER (no ?client= in URL) ----------
  async function renderClientManager(){
    app.innerHTML =
      '<header><div class="header-text"><h1>Work Ledger</h1><p>Client billing overview</p></div>' +
      '<span class="logout-link" id="logoutLink">Sign out</span></header>' +
      '<h2 class="manager-heading">Clients</h2>' +
      '<div class="client-list" id="clientList">Loading…</div>' +
      '<div class="panel"><h2>New client</h2>' +
      '<div class="new-client-form">' +
        '<div class="field"><label>NAME</label><input id="newName" /></div>' +
        '<div class="field"><label>SLUG</label><input id="newSlug" placeholder="auto-generated" /></div>' +
        '<div class="field"><label>BUDGET</label><input id="newBudget" type="number" value="500" step="0.01" /></div>' +
      '</div>' +
      '<div class="new-client-form">' +
        '<div class="field"><label>CONTACT NAME <span class="optional-tag">optional</span></label><input id="newContact" /></div>' +
        '<div class="field"><label>PROJECT <span class="optional-tag">optional</span></label><input id="newProject" /></div>' +
        '<div class="field"><label>EMAIL <span class="optional-tag">optional</span></label><input id="newEmail" type="email" /></div>' +
      '</div>' +
      '<button class="btn-add" id="newClientBtn">Add client</button>' +
      '<div class="save-note" id="managerNote"></div></div>';

    document.getElementById('logoutLink').addEventListener('click', function(){ clearToken(); renderLogin(); });

    async function refreshList(){
      const list = await pbFetch('/api/collections/clients/records?sort=name&perPage=200');
      const listEl = document.getElementById('clientList');
      if (!list.items.length) {
        listEl.innerHTML = '<div style="color:var(--paper-dim);font-size:12px;">No clients yet — add one below.</div>';
      } else {
        listEl.innerHTML = list.items.map(function(c){
          const meta = [c.project_name, c.contact_name].filter(Boolean).join(' \u2014 ');
          return '<a href="?client=' + encodeURIComponent(c.slug) + '"><span><span class="client-name">' + escapeHtml(c.name) + '</span>' +
            (meta ? '<span class="client-meta">' + escapeHtml(meta) + '</span>' : '') +
            '</span><span class="budget">' + money(c.budget) + ' budget</span></a>';
        }).join('');
      }
    }

    document.getElementById('newName').addEventListener('input', function(){
      const slugField = document.getElementById('newSlug');
      if (!slugField.dataset.touched) {
        slugField.value = this.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }
    });
    document.getElementById('newSlug').addEventListener('input', function(){ this.dataset.touched = '1'; });

    document.getElementById('newClientBtn').addEventListener('click', async function(){
      const name = document.getElementById('newName').value.trim();
      const slug = document.getElementById('newSlug').value.trim();
      const budget = parseFloat(document.getElementById('newBudget').value) || 0;
      const contact_name = document.getElementById('newContact').value.trim();
      const project_name = document.getElementById('newProject').value.trim();
      const email = document.getElementById('newEmail').value.trim();
      const note = document.getElementById('managerNote');
      if (!name || !slug) { note.textContent = 'Name and slug are required.'; return; }
      try {
        await pbFetch('/api/collections/clients/records', {
          method: 'POST',
          body: JSON.stringify({ name: name, slug: slug, budget: budget, contact_name: contact_name, project_name: project_name, email: email })
        });
        window.location.href = '?client=' + encodeURIComponent(slug);
      } catch (err) {
        note.textContent = err.message;
      }
    });

    await refreshList();
  }

  // ---------- LEDGER VIEW (?client=slug) ----------
  async function renderLedger(){
    const filterVal = "slug='" + clientSlug.replace(/'/g, "\\'") + "'";
    const clientRes = await pbFetch('/api/collections/clients/records?filter=' + encodeURIComponent(filterVal));
    if (!clientRes.items.length) {
      app.innerHTML = '<div class="panel">No client found for "' + escapeHtml(clientSlug) + '". ' +
        '<a href="?" style="color:var(--brass);">Back to clients</a></div>';
      return;
    }
    let client = clientRes.items[0];

    app.innerHTML =
      '<header>' +
        '<div class="header-text">' +
          (isClientView ? '' : '<a href="?" class="back-link">&larr; All clients</a><br/>') +
          '<h1 id="clientHeading">' + escapeHtml(client.name) + ' — Work Ledger</h1>' +
          '<p id="clientSub">' + (isClientView ? 'Prepaid to Little Rascal Records' : escapeHtml(client.slug)) + '</p>' +
        '</div>' +
        (isClientView ? '' : '<span class="logout-link" id="logoutLink">Sign out</span>') +
      '</header>' +
      '<section class="readout">' +
        '<div class="cell"><label>BUDGET</label><input class="editable-budget" id="budgetInput" /></div>' +
        '<div class="cell"><label>SPENT</label><div class="value" id="spentValue">$0.00</div></div>' +
        '<div class="cell"><label>REMAINING</label><div class="value remaining" id="remainingValue">$0.00</div></div>' +
        '<div class="meter-track"><div class="meter-fill" id="meterFill" style="width:0%;"></div></div>' +
      '</section>' +
      (isClientView ? '' :
      '<section class="panel">' +
        '<h2>Client details</h2>' +
        '<div class="new-client-form">' +
          '<div class="field"><label>CONTACT NAME</label><input id="contactInput" /></div>' +
          '<div class="field"><label>PROJECT</label><input id="projectInput" /></div>' +
          '<div class="field"><label>EMAIL</label><input id="emailInput" type="email" /></div>' +
        '</div>' +
        '<button class="btn-ghost" id="sendLedgerBtn" style="margin-top:4px;">Prepare ledger email</button>' +
        '<div class="save-note" id="sendNote" style="margin-top:6px;"></div>' +
        '<div id="sendResult" style="display:none;"></div>' +
      '</section>') +
      '<section class="panel" id="entryPanel">' +
        '<h2>Log new work</h2>' +
        '<div class="form-grid">' +
          '<div class="field"><label>SONG / WORK</label><input id="songInput" /></div>' +
          '<div class="field"><label>TYPE</label><select id="workType">' +
            '<option value="editing">Editing</option>' +
            '<option value="mastering">Mastering</option>' +
            '<option value="stem">Stem mastering</option>' +
            '<option value="revision">Revision (included)</option>' +
            '<option value="extra_revision">Extra revision round</option>' +
            '<option value="custom">Custom</option>' +
          '</select></div>' +
          '<div class="field" id="qtyField"><label id="qtyLabel">HOURS</label><input id="qtyInput" type="number" value="1" step="0.5" /></div>' +
          '<div class="field" id="customCostField" style="display:none;"><label>COST</label><input id="customCostInput" type="number" step="0.01" /></div>' +
          '<div class="field"><label>DATE</label><input id="dateInput" type="date" /></div>' +
          '<button class="btn-add" id="addBtn">Add</button>' +
        '</div>' +
        '<div class="hint" id="rateHint"></div>' +
      '</section>' +
      '<section class="ledger">' +
        '<h2>Itemised log</h2>' +
        '<table><thead><tr><th>Song / Work</th><th>Date</th><th class="num">Cost</th><th class="num">Balance</th><th></th></tr></thead>' +
        '<tbody id="ledgerBody"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody></table>' +
      '</section>' +
      '<div class="footer-bar"><span id="saveNote" class="save-note"></span>' +
      '<span class="toggle-link" id="modeToggle"></span></div>';

    const els = {
      budgetInput: document.getElementById('budgetInput'),
      contactInput: document.getElementById('contactInput'),
      projectInput: document.getElementById('projectInput'),
      emailInput: document.getElementById('emailInput'),
      sendLedgerBtn: document.getElementById('sendLedgerBtn'),
      sendNote: document.getElementById('sendNote'),
      sendResult: document.getElementById('sendResult'),
      spent: document.getElementById('spentValue'),
      remaining: document.getElementById('remainingValue'),
      meter: document.getElementById('meterFill'),
      entryPanel: document.getElementById('entryPanel'),
      songInput: document.getElementById('songInput'),
      workType: document.getElementById('workType'),
      qtyField: document.getElementById('qtyField'),
      qtyLabel: document.getElementById('qtyLabel'),
      qtyInput: document.getElementById('qtyInput'),
      customCostField: document.getElementById('customCostField'),
      customCostInput: document.getElementById('customCostInput'),
      dateInput: document.getElementById('dateInput'),
      rateHint: document.getElementById('rateHint'),
      addBtn: document.getElementById('addBtn'),
      ledgerBody: document.getElementById('ledgerBody'),
      saveNote: document.getElementById('saveNote'),
      modeToggle: document.getElementById('modeToggle'),
      logoutLink: document.getElementById('logoutLink')
    };

    if (els.dateInput) els.dateInput.value = new Date().toISOString().slice(0, 10);
    if (els.contactInput) els.contactInput.value = client.contact_name || '';
    if (els.projectInput) els.projectInput.value = client.project_name || '';
    if (els.emailInput) els.emailInput.value = client.email || '';

    if (els.logoutLink) els.logoutLink.addEventListener('click', function(){ clearToken(); renderLogin(); });

    function computeCost(){
      const type = els.workType.value;
      if (type === 'custom') return parseFloat(els.customCostInput.value) || 0;
      const qty = parseFloat(els.qtyInput.value) || 0;
      return qty * RATES[type];
    }
    function updateHint(){
      const type = els.workType.value;
      if (type === 'custom') { els.rateHint.textContent = 'Custom line item'; return; }
      const qty = parseFloat(els.qtyInput.value) || 0;
      const rate = RATES[type];
      const unit = UNITS[type];
      els.rateHint.textContent = qty + ' ' + unit + (qty === 1 ? '' : 's') + ' \u00d7 $' + rate + '/' + unit + ' = ' + money(qty * rate);
    }
    function onWorkTypeChange(){
      const type = els.workType.value;
      els.qtyLabel.textContent = QTY_LABELS[type];
      if (type === 'custom') { els.qtyField.style.display = 'none'; els.customCostField.style.display = 'flex'; }
      else { els.qtyField.style.display = 'flex'; els.customCostField.style.display = 'none'; }
      updateHint();
    }

    async function loadEntries(){
      const filter = "client='" + client.id + "'";
      const res = await pbFetch('/api/collections/work_entries/records?filter=' + encodeURIComponent(filter) + '&sort=sort_order,date&perPage=500');
      return res.items;
    }

    async function render(){
      els.budgetInput.value = Number(client.budget).toFixed(2);
      let running = client.budget;
      let totalSpent = 0;
      const entries = await loadEntries();
      els.ledgerBody.innerHTML = '';
      if (entries.length === 0) {
        els.ledgerBody.innerHTML = '<tr class="empty-row"><td colspan="5">No work logged yet.</td></tr>';
      } else {
        entries.forEach(function(entry, idx){
          running -= entry.cost;
          totalSpent += entry.cost;
          const tr = document.createElement('tr');
          tr.dataset.id = entry.id;
          if (!isClientView) tr.draggable = !isCoarsePointer;
          const dateStr = new Date(entry.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
          const dateIso = new Date(entry.date).toISOString().slice(0, 10);
          const dateCell = isClientView
            ? dateStr
            : '<input type="date" class="date-edit" data-id="' + entry.id + '" value="' + dateIso + '" />';
          const dragHandle = isClientView ? '' : '<span class="drag-handle" title="Drag to reorder">\u2630</span>';
          const touchControls = isClientView ? '' :
            '<button class="reorder-btn" data-id="' + entry.id + '" data-dir="up" title="Move up"' + (idx === 0 ? ' disabled' : '') + '>\u2191</button>' +
            '<button class="reorder-btn" data-id="' + entry.id + '" data-dir="down" title="Move down"' + (idx === entries.length - 1 ? ' disabled' : '') + '>\u2193</button>';
          tr.innerHTML =
            '<td>' + dragHandle + '<div class="song-name">' + escapeHtml(entry.song) + '</div><div class="work-type">' + escapeHtml(entry.label) + '</div></td>' +
            '<td>' + dateCell + '</td>' +
            '<td class="num cost-cell">' + money(entry.cost) + '</td>' +
            '<td class="num balance-cell">' + money(running) + '</td>' +
            '<td class="row-actions">' + touchControls + (isClientView ? '' : '<button class="del-btn" data-id="' + entry.id + '" title="Remove">\u2715</button>') + '</td>';
          els.ledgerBody.appendChild(tr);
        });
      }
      els.spent.textContent = money(totalSpent);
      els.remaining.textContent = money(running);
      els.remaining.classList.toggle('negative', running < 0);
      const pct = client.budget > 0 ? Math.min(100, (totalSpent / client.budget) * 100) : 0;
      els.meter.style.width = pct + '%';
      els.meter.classList.toggle('over', running < 0);

      if (!isClientView) {
        els.ledgerBody.querySelectorAll('.del-btn').forEach(function(btn){
          btn.addEventListener('click', async function(){
            try {
              await pbFetch('/api/collections/work_entries/records/' + btn.getAttribute('data-id'), { method: 'DELETE' });
              render();
            } catch (err) { alert(err.message); }
          });
        });

        els.ledgerBody.querySelectorAll('.date-edit').forEach(function(input){
          input.addEventListener('change', async function(){
            const id = input.getAttribute('data-id');
            if (!input.value) return;
            els.saveNote.textContent = 'Saving\u2026';
            try {
              await pbFetch('/api/collections/work_entries/records/' + id, {
                method: 'PATCH',
                body: JSON.stringify({ date: new Date(input.value + 'T12:00:00').toISOString() })
              });
              els.saveNote.textContent = 'Saved';
            } catch (err) {
              els.saveNote.textContent = 'Save failed';
            }
            setTimeout(function(){ els.saveNote.textContent = ''; }, 1500);
            render();
          });
        });

        async function applyReorder(newOrderIds){
          els.saveNote.textContent = 'Saving\u2026';
          try {
            await Promise.all(newOrderIds.map(function(id, i){
              return pbFetch('/api/collections/work_entries/records/' + id, {
                method: 'PATCH',
                body: JSON.stringify({ sort_order: (i + 1) * 10 })
              });
            }));
            els.saveNote.textContent = 'Saved';
          } catch (err) {
            els.saveNote.textContent = 'Save failed';
          }
          setTimeout(function(){ els.saveNote.textContent = ''; }, 1500);
          render();
        }

        // Desktop: drag and drop
        let dragId = null;
        els.ledgerBody.querySelectorAll('tr[draggable="true"]').forEach(function(row){
          row.addEventListener('dragstart', function(){
            dragId = row.dataset.id;
            row.classList.add('dragging');
          });
          row.addEventListener('dragend', function(){
            row.classList.remove('dragging');
          });
          row.addEventListener('dragover', function(e){
            e.preventDefault();
            row.classList.add('drag-over');
          });
          row.addEventListener('dragleave', function(){
            row.classList.remove('drag-over');
          });
          row.addEventListener('drop', function(e){
            e.preventDefault();
            row.classList.remove('drag-over');
            const targetId = row.dataset.id;
            if (!dragId || dragId === targetId) return;
            const order = entries.map(function(en){ return en.id; });
            const fromIdx = order.indexOf(dragId);
            const toIdx = order.indexOf(targetId);
            if (fromIdx === -1 || toIdx === -1) return;
            order.splice(toIdx, 0, order.splice(fromIdx, 1)[0]);
            applyReorder(order);
          });
        });

        // Touch/mobile: up/down buttons
        els.ledgerBody.querySelectorAll('.reorder-btn').forEach(function(btn){
          btn.addEventListener('click', function(){
            const id = btn.getAttribute('data-id');
            const dir = btn.getAttribute('data-dir');
            const order = entries.map(function(en){ return en.id; });
            const idx = order.indexOf(id);
            const swapIdx = dir === 'up' ? idx - 1 : idx + 1;
            if (swapIdx < 0 || swapIdx >= order.length) return;
            order.splice(swapIdx, 0, order.splice(idx, 1)[0]);
            applyReorder(order);
          });
        });
      }
    }

    els.workType.addEventListener('change', onWorkTypeChange);
    els.qtyInput.addEventListener('input', updateHint);
    els.customCostInput.addEventListener('input', updateHint);

    els.budgetInput.addEventListener('change', async function(){
      const val = parseFloat(els.budgetInput.value);
      client.budget = isNaN(val) ? 0 : val;
      els.saveNote.textContent = 'Saving\u2026';
      try {
        await pbFetch('/api/collections/clients/records/' + client.id, {
          method: 'PATCH',
          body: JSON.stringify({ budget: client.budget })
        });
        els.saveNote.textContent = 'Saved';
      } catch (err) {
        els.saveNote.textContent = 'Save failed';
      }
      setTimeout(function(){ els.saveNote.textContent = ''; }, 1500);
      render();
    });

    function saveClientField(field, value){
      els.saveNote.textContent = 'Saving\u2026';
      const body = {};
      body[field] = value;
      pbFetch('/api/collections/clients/records/' + client.id, {
        method: 'PATCH',
        body: JSON.stringify(body)
      }).then(function(){
        client[field] = value;
        els.saveNote.textContent = 'Saved';
      }).catch(function(){
        els.saveNote.textContent = 'Save failed';
      }).finally(function(){
        setTimeout(function(){ els.saveNote.textContent = ''; }, 1500);
      });
    }

    if (els.contactInput) els.contactInput.addEventListener('change', function(){
      saveClientField('contact_name', els.contactInput.value.trim());
    });
    if (els.projectInput) els.projectInput.addEventListener('change', function(){
      saveClientField('project_name', els.projectInput.value.trim());
    });
    if (els.emailInput) els.emailInput.addEventListener('change', function(){
      saveClientField('email', els.emailInput.value.trim());
    });

    if (els.sendLedgerBtn) els.sendLedgerBtn.addEventListener('click', function(){
      const email = (els.emailInput && els.emailInput.value.trim()) || client.email;
      if (!email) {
        els.sendNote.textContent = 'Add an email address above first.';
        setTimeout(function(){ els.sendNote.textContent = ''; }, 2000);
        return;
      }
      const link = window.location.origin + '/?client=' + encodeURIComponent(client.slug) + '&view=client';
      const subject = 'Your work ledger \u2014 ' + client.name;
      const greeting = client.contact_name ? 'Hi ' + client.contact_name + ',' : 'Hi,';
      const body =
        greeting + '\n\n' +
        'Here\u2019s a live link to your work ledger with Little Rascal Records, showing your budget, work completed, and remaining balance:\n\n' +
        link + '\n\n' +
        'Feel free to check in on it anytime.\n\n' +
        'Thanks,\nLittle Rascal Records';
      const mailto = 'mailto:' + encodeURIComponent(email) +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);
      const fullMessage = 'To: ' + email + '\nSubject: ' + subject + '\n\n' + body;

      els.sendResult.style.display = 'block';
      els.sendResult.innerHTML =
        '<div class="send-preview">' +
          '<a href="' + mailto + '" class="btn-add" style="display:inline-block; text-decoration:none; width:auto; padding:8px 14px;">Open in email app</a>' +
          '<button class="btn-ghost" id="copyMessageBtn" style="margin-left:8px;">Copy message</button>' +
          '<div class="hint" style="margin-top:8px;">If nothing opens above (common if you use Gmail in the browser), hit Copy and paste it into a new email yourself.</div>' +
          '<textarea readonly class="message-preview">' + escapeHtml(fullMessage) + '</textarea>' +
        '</div>';

      document.getElementById('copyMessageBtn').addEventListener('click', async function(){
        try {
          await navigator.clipboard.writeText(fullMessage);
          els.sendNote.textContent = 'Copied \u2014 paste into your email client.';
        } catch (err) {
          els.sendNote.textContent = 'Could not copy automatically \u2014 select the text below and copy manually.';
        }
        setTimeout(function(){ els.sendNote.textContent = ''; }, 2500);
      });
    });

    els.addBtn.addEventListener('click', async function(){
      const song = els.songInput.value.trim();
      if (!song) { els.songInput.focus(); return; }
      const type = els.workType.value;
      const cost = computeCost();
      const qty = parseFloat(els.qtyInput.value) || 0;
      let label;
      if (type === 'editing') label = qty + ' hr' + (qty === 1 ? '' : 's') + ' editing';
      else if (type === 'mastering') label = 'Standard mastering \u00d7 ' + qty;
      else if (type === 'stem') label = 'Stem mastering \u00d7 ' + qty;
      else if (type === 'revision') label = 'Revision (included) \u00d7 ' + qty;
      else if (type === 'extra_revision') label = 'Extra revision round \u00d7 ' + qty;
      else label = 'Custom line item';

      try {
        els.saveNote.textContent = 'Saving\u2026';
        const chosenDate = els.dateInput && els.dateInput.value
          ? new Date(els.dateInput.value + 'T12:00:00').toISOString()
          : new Date().toISOString();
        await pbFetch('/api/collections/work_entries/records', {
          method: 'POST',
          body: JSON.stringify({
            client: client.id,
            song: song,
            work_type: type,
            quantity: type === 'custom' ? null : qty,
            rate: type === 'custom' ? null : RATES[type],
            cost: cost,
            date: chosenDate,
            label: label,
            sort_order: Date.now()
          })
        });
        els.songInput.value = '';
        els.customCostInput.value = '';
        els.saveNote.textContent = 'Saved';
        setTimeout(function(){ els.saveNote.textContent = ''; }, 1500);
        render();
      } catch (err) {
        els.saveNote.textContent = 'Save failed';
      }
    });

    els.modeToggle.addEventListener('click', function(){
      const url = new URL(window.location.href);
      if (isClientView) url.searchParams.delete('view');
      else url.searchParams.set('view', 'client');
      window.location.href = url.toString();
    });

    if (isClientView) {
      els.entryPanel.style.display = 'none';
      els.budgetInput.setAttribute('readonly', 'readonly');
      els.modeToggle.textContent = 'Switch to edit view';
    } else {
      els.modeToggle.textContent = 'Switch to client view';
    }

    onWorkTypeChange();
    render();
  }

  // ---------- PUBLIC READ-ONLY VIEW (unauthenticated client link) ----------
  async function renderPublicLedger(){
    app.innerHTML = 'Loading\u2026';
    try {
      const res = await fetch(API + '/api/ledger-view/' + encodeURIComponent(clientSlug));
      if (!res.ok) {
        app.innerHTML = '<div class="panel">No ledger found for this link.</div>';
        return;
      }
      const data = await res.json();
      let running = data.budget;
      let totalSpent = 0;

      const rows = (data.entries || []).map(function(entry){
        running -= entry.cost;
        totalSpent += entry.cost;
        const dateStr = new Date(entry.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
        return '<tr><td><div class="song-name">' + escapeHtml(entry.song) + '</div><div class="work-type">' + escapeHtml(entry.label) + '</div></td>' +
          '<td>' + dateStr + '</td>' +
          '<td class="num cost-cell">' + money(entry.cost) + '</td>' +
          '<td class="num balance-cell">' + money(running) + '</td></tr>';
      }).join('') || '<tr class="empty-row"><td colspan="4">No work logged yet.</td></tr>';

      const remaining = data.budget - totalSpent;
      const pct = data.budget > 0 ? Math.min(100, (totalSpent / data.budget) * 100) : 0;

      app.innerHTML =
        '<header><div class="header-text">' +
          '<h1>' + escapeHtml(data.name) + ' \u2014 Work Ledger</h1>' +
          '<p>Prepaid to Little Rascal Records</p>' +
        '</div></header>' +
        '<section class="readout">' +
          '<div class="cell"><label>BUDGET</label><div class="value">' + money(data.budget) + '</div></div>' +
          '<div class="cell"><label>SPENT</label><div class="value">' + money(totalSpent) + '</div></div>' +
          '<div class="cell"><label>REMAINING</label><div class="value remaining' + (remaining < 0 ? ' negative' : '') + '">' + money(remaining) + '</div></div>' +
          '<div class="meter-track"><div class="meter-fill' + (remaining < 0 ? ' over' : '') + '" style="width:' + pct + '%;"></div></div>' +
        '</section>' +
        '<section class="ledger">' +
          '<h2>Itemised log</h2>' +
          '<table><thead><tr><th>Song / Work</th><th>Date</th><th class="num">Cost</th><th class="num">Balance</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>' +
        '</section>';
    } catch (err) {
      app.innerHTML = '<div class="panel">Something went wrong loading this ledger.</div>';
    }
  }

  async function boot(){
    const token = getToken();
    if (!token) {
      if (isClientView && clientSlug) {
        return renderPublicLedger();
      }
      renderLogin();
      return;
    }
    try {
      if (clientSlug) await renderLedger();
      else await renderClientManager();
    } catch (err) {
      console.error(err);
    }
  }

  boot();
})();
</script>
</body>
</html>
